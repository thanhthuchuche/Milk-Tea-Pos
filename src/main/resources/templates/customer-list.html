<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý khách hàng - Cô Đào Quán POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>
            <i class="fa-solid fa-users text-primary"></i> Quản lý Khách hàng
        </h2>
        <a href="/customers/add" class="btn btn-success">
            <i class="fa-solid fa-user-plus"></i> Thêm khách hàng mới
        </a>
    </div>

    <!-- Search Box -->
    <div class="search-form-row mb-4">
        <form action="/customers/search" method="get" class="row g-2 align-items-center">
            <div class="col-md-5">
                <input type="text" name="keyword" class="form-control" placeholder="Tìm tên, số điện thoại, email...">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm
                </button>
            </div>
            <div class="col-md-4 text-end">
                <a href="/customers" class="btn btn-secondary"><i class="fa-solid fa-rotate-left"></i> Làm mới</a>
            </div>
        </form>
    </div>

    <div class="card shadow-sm">
        <div class="card-header text-white">
            <i class="fa-solid fa-address-book"></i> Danh sách khách hàng thân thiết
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 70px;">ID</th>
                        <th>Tên khách hàng</th>
                        <th>Số điện thoại</th>
                        <th>Email</th>
                        <th>Tích điểm loyalty</th>
                        <th class="text-center" style="width: 140px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="customer : ${customers}">
                        <td class="fw-bold" th:text="${customer.customerId}">1</td>
                        <td class="fw-bold text-dark">
                            <i class="fa-solid fa-user-tag text-muted me-1"></i>
                            <span th:text="${customer.fullName}">Nguyễn Văn A</span>
                        </td>
                        <td>
                            <i class="fa-solid fa-phone text-muted me-1"></i>
                            <span th:text="${customer.phone}">0911223344</span>
                        </td>
                        <td>
                            <i class="fa-solid fa-envelope text-muted me-1"></i>
                            <span th:text="${customer.email}">customer@gmail.com</span>
                        </td>
                        <td>
                            <span class="badge bg-warning text-dark fw-bold">
                                <i class="fa-solid fa-star"></i> <span th:text="${customer.point}">100</span> điểm
                            </span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{'/customers/edit/' + ${customer.customerId}}" class="btn btn-warning btn-sm" title="Chỉnh sửa">
                                <i class="fa-solid fa-pen"></i> Sửa
                            </a>
                            <a th:href="@{'/customers/delete/' + ${customer.customerId}}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc chắn muốn xóa thông tin khách hàng này không?')" title="Xóa">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
