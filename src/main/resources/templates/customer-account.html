<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tài khoản khách hàng - Cô Đào Quán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-4" style="max-width: 760px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h2 class="mb-1"><i class="fa-solid fa-user-pen text-primary me-2"></i>Tài khoản của tôi</h2><p class="text-muted mb-0">Cập nhật thông tin để quán hỗ trợ bạn nhanh hơn.</p></div>
        <a href="/customer/dashboard" class="btn btn-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại</a>
    </div>
    <div th:if="${successMessage}" class="alert alert-success"><i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}">Đã cập nhật.</span></div>
    <div class="card shadow-sm">
        <div class="card-header"><i class="fa-solid fa-address-card me-2"></i>Thông tin liên hệ</div>
        <div class="card-body">
            <form method="post" th:action="@{/customer/account/save}">
                <div class="mb-3"><label class="form-label">Họ và tên</label><input name="fullName" class="form-control" th:value="${customer.fullName}" required></div>
                <div class="mb-3"><label class="form-label">Số điện thoại</label><input name="phone" class="form-control" th:value="${customer.phone}" required></div>
                <div class="mb-4"><label class="form-label">Email</label><input type="email" name="email" class="form-control" th:value="${customer.email}" required></div>
                <button class="btn btn-primary w-100" type="submit"><i class="fa-solid fa-floppy-disk me-1"></i> Lưu thông tin</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
