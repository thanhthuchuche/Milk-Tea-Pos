<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý sản phẩm - Cô Đào Quán POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .product-thumb {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>
            <i class="fa-solid fa-wine-glass text-primary"></i> Quản lý Sản phẩm
        </h2>
        <a href="/products/add" class="btn btn-success">
            <i class="fa-solid fa-plus"></i> Thêm sản phẩm mới
        </a>
    </div>

    <!-- Search Box -->
    <div class="search-form-row mb-4">
        <form action="/products/search" method="get" class="row g-2 align-items-center">
            <div class="col-md-5">
                <input type="text" name="keyword" class="form-control" placeholder="Tìm tên sản phẩm, danh mục...">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm
                </button>
            </div>
            <div class="col-md-4 text-end">
                <a href="/products" class="btn btn-secondary"><i class="fa-solid fa-rotate-left"></i> Làm mới</a>
            </div>
        </form>
    </div>

    <div class="card shadow-sm">
        <div class="card-header text-white">
            <i class="fa-solid fa-list"></i> Danh sách sản phẩm POS
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 60px;">ID</th>
                        <th style="width: 70px;">Hình ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Danh mục</th>
                        <th>Giá bán</th>
                        <th>Trạng thái</th>
                        <th class="text-center" style="width: 180px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${products}">
                        <td class="fw-bold" th:text="${product.productId}">1</td>
                        <td>
                            <img th:src="${product.image != null and #strings.startsWith(product.image, 'http') ? product.image : '/images/' + product.image}" 
                                 class="product-thumb" 
                                 alt="Ảnh">
                        </td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${product.productName}">Tên món</div>
                            <div class="small text-muted text-truncate" style="max-width: 250px;" th:text="${product.description}">Mô tả</div>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark fw-bold border" 
                                  th:text="${product.category != null ? product.category.categoryName : 'Khác'}">Trà Sữa</span>
                        </td>
                        <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">39,000 đ</td>
                        <td>
                            <span class="badge bg-success" th:if="${product.status == 'ACTIVE'}">ĐANG BÁN</span>
                            <span class="badge bg-danger" th:if="${product.status != 'ACTIVE'}">NGỪNG BÁN</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{'/product-ingredients/' + ${product.productId}}" class="btn btn-info btn-sm text-white" title="Định lượng nguyên liệu">
                                <i class="fa-solid fa-wheat-awn"></i>
                            </a>
                            <a th:href="@{'/products/edit/' + ${product.productId}}" class="btn btn-warning btn-sm" title="Chỉnh sửa">
                                <i class="fa-solid fa-pen"></i>
                            </a>
                            <a th:href="@{'/products/delete/' + ${product.productId}}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này không?')" title="Xóa">
                                <i class="fa-solid fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
