<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Voucher - Cô Đào Quán POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .voucher-code-badge {
            font-family: monospace;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            background: #F8F4EF;
            color: var(--primary-dark);
            border: 1.5px dashed var(--primary-color);
            padding: 0.35rem 0.8rem;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>
            <i class="fa-solid fa-ticket text-primary"></i> Quản lý Mã Giảm Giá & Voucher
        </h2>
        <a href="/vouchers/add" class="btn btn-success">
            <i class="fa-solid fa-plus"></i> Tạo Voucher mới
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header text-white">
            <i class="fa-solid fa-tags"></i> Danh sách Voucher khuyến mãi
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 70px;">ID</th>
                        <th>Mã Voucher</th>
                        <th>Phần trăm giảm giá</th>
                        <th>Ngày bắt đầu</th>
                        <th>Ngày kết thúc</th>
                        <th class="text-center" style="width: 140px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="voucher : ${vouchers}">
                        <td class="fw-bold" th:text="${voucher.voucherId}">1</td>
                        <td>
                            <span class="voucher-code-badge" th:text="${voucher.voucherCode}">CODAOQUAN20</span>
                        </td>
                        <td>
                            <span class="badge bg-danger text-white fw-bold fs-6">
                                <i class="fa-solid fa-fire me-1"></i> GIẢM <span th:text="${voucher.discountPercent}">20</span>%
                            </span>
                        </td>
                        <td th:text="${voucher.startDate != null ? #temporals.format(voucher.startDate, 'dd/MM/yyyy') : 'Ngay lập tức'}">01/01/2026</td>
                        <td th:text="${voucher.endDate != null ? #temporals.format(voucher.endDate, 'dd/MM/yyyy') : 'Vĩnh viễn'}">31/12/2026</td>
                        <td class="text-center">
                            <a th:href="@{/vouchers/edit/{id}(id=${voucher.voucherId})}" class="btn btn-warning btn-sm" title="Sửa">
                                <i class="fa-solid fa-pen"></i> Sửa
                            </a>
                            <a th:href="@{/vouchers/delete/{id}(id=${voucher.voucherId})}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa voucher này không?')" title="Xóa">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
