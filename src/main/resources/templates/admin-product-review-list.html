<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Quản lý đánh giá</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><h2 class="mb-4"><i class="fa-solid fa-star text-warning me-2"></i>Quản lý đánh giá sản phẩm</h2><div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Sản phẩm</th><th>Khách hàng</th><th>Đánh giá</th><th>Bình luận</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="review : ${reviews}"><td class="fw-bold" th:text="${review.product.productName}">Món</td><td th:text="${review.customer.fullName}">Khách</td><td class="text-warning" th:text="${'★'.repeat(review.rating)}">★★★★★</td><td style="max-width:360px" th:text="${review.comment}">Nội dung</td><td><span class="badge bg-success" th:if="${review.status == 'VISIBLE'}">Đang hiển thị</span><span class="badge bg-secondary" th:if="${review.status == 'HIDDEN'}">Đã ẩn</span></td><td><a th:if="${review.status == 'VISIBLE'}" class="btn btn-warning btn-sm" th:href="@{/admin/product-reviews/hide/{id}(id=${review.reviewId})}">Ẩn</a><a th:if="${review.status == 'HIDDEN'}" class="btn btn-success btn-sm" th:href="@{/admin/product-reviews/show/{id}(id=${review.reviewId})}">Hiện</a><a class="btn btn-danger btn-sm" th:href="@{/admin/product-reviews/delete/{id}(id=${review.reviewId})}" onclick="return confirm('Xóa đánh giá này?')">Xóa</a></td></tr><tr th:if="${reviews == null or reviews.isEmpty()}"><td colspan="6" class="text-center text-muted py-5">Chưa có đánh giá nào.</td></tr></tbody></table></div></div></main></body></html>
