<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý đơn hàng - Cô Đào Quán POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>
            <i class="fa-solid fa-clipboard-list text-primary"></i> Quản lý Đơn hàng tại quán
        </h2>
        <a href="/orders/add" class="btn btn-success">
            <i class="fa-solid fa-cart-plus"></i> Tạo đơn hàng POS mới
        </a>
    </div>

    <!-- Search Box -->
    <div class="search-form-row mb-4">
        <form action="/orders/search" method="get" class="row g-2 align-items-center">
            <div class="col-md-5">
                <input type="text" name="keyword" class="form-control" placeholder="Tìm theo tên khách hàng, số bàn...">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm
                </button>
            </div>
            <div class="col-md-4 text-end">
                <a href="/orders" class="btn btn-secondary"><i class="fa-solid fa-rotate-left"></i> Làm mới</a>
            </div>
        </form>
    </div>

    <div class="card shadow-sm">
        <div class="card-header text-white">
            <i class="fa-solid fa-receipt"></i> Danh sách đơn hàng POS
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 70px;">ID</th>
                        <th>Khách hàng</th>
                        <th>Vị trí bàn</th>
                        <th>Nhân viên phụ trách</th>
                        <th>Ngày tạo đơn</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th class="text-center" style="width: 140px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td class="fw-bold" th:text="${order.orderId}">1</td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${order.customer != null ? order.customer.fullName : 'Khách lẻ'}">Khách lẻ</div>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark fw-bold border" th:text="${order.tableCafe != null ? order.tableCafe.tableNumber : 'Mang về'}">Bàn 01</span>
                        </td>
                        <td th:text="${order.user != null ? order.user.fullName : 'Khách tự gọi'}">Nhân viên</td>
                        <td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy HH:mm')}">24/07/2026</td>
                        <td class="fw-bold text-danger" th:text="${order.totalAmount != null ? #numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT') + ' đ' : '0 đ'}">58,000 đ</td>
                        <td>
                            <span class="badge bg-warning" th:if="${order.status == 'PENDING'}">CHỜ XỬ LÝ</span>
                            <span class="badge bg-success" th:if="${order.status == 'COMPLETED'}">HOÀN THÀNH</span>
                            <span class="badge bg-danger" th:if="${order.status == 'CANCELLED'}">ĐÃ HỦY</span>
                            <span class="badge bg-secondary" th:if="${order.status != 'PENDING' and order.status != 'COMPLETED' and order.status != 'CANCELLED'}" th:text="${order.status}">KHÁC</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/orders/detail/{id}(id=${order.orderId})}" class="btn btn-primary btn-sm" title="Xem chi tiết đơn">
                                <i class="fa-solid fa-eye"></i> Xem
                            </a>
                            <a th:href="@{/orders/delete/{id}(id=${order.orderId})}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa đơn hàng này không?')" title="Xóa đơn">
                                <i class="fa-solid fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
