<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-xl navbar-dark sticky-top">
    <!-- Dynamic Theme & Font Injection -->
    <script>
        if (!document.querySelector('link[href*="style.css"]')) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = '/css/style.css';
            document.head.appendChild(link);
        }
        if (!document.querySelector('link[href*="font-awesome"]')) {
            const fa = document.createElement('link');
            fa.rel = 'stylesheet';
            fa.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css';
            document.head.appendChild(fa);
        }
        
        // Auto Wrap Tables & Enhance UI elements on DOM Load
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll("table.table").forEach(table => {
                if (!table.parentElement.classList.contains("table-responsive")) {
                    const wrapper = document.createElement("div");
                    wrapper.className = "table-responsive";
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                }
            });
            
            document.querySelectorAll("form[action*='/search']").forEach(form => {
                form.classList.add("search-form-row");
            });

            // Highlight Active Link dynamically
            const currentPath = window.location.pathname;
            document.querySelectorAll(".navbar-nav .nav-link").forEach(link => {
                if (link.getAttribute("href") === currentPath) {
                    link.parentElement.classList.add("active");
                }
            });
        });
    </script>

    <div class="container-fluid px-3">
        <a class="navbar-brand me-3" href="/">
            <i class="fa-solid fa-mug-hot"></i>
            <span>Cô Đào Quán POS</span>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STAFF')">
                    <a class="nav-link" href="/">
                        <i class="fa-solid fa-chart-pie me-1 opacity-75"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STAFF')">
                    <a class="nav-link" href="/products">
                        <i class="fa-solid fa-wine-glass me-1 opacity-75"></i> Sản phẩm
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STAFF')">
                    <a class="nav-link" th:href="@{/ingredients}">
                        <i class="fa-solid fa-boxes-stacked me-1 opacity-75"></i> Nguyên liệu
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/categories">
                        <i class="fa-solid fa-layer-group me-1 opacity-75"></i> Danh mục
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STAFF')">
                    <a class="nav-link" href="/customers">
                        <i class="fa-solid fa-users me-1 opacity-75"></i> Khách hàng
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link" th:href="@{/customer/menu}">
                        <i class="fa-solid fa-store me-1 opacity-75"></i> Đặt món
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link" th:href="@{/customer/orders}">
                        <i class="fa-solid fa-receipt me-1 opacity-75"></i> Đơn hàng của tôi
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/users">
                        <i class="fa-solid fa-user-gear me-1 opacity-75"></i> Nhân viên
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STAFF')">
                    <a class="nav-link" href="/orders">
                        <i class="fa-solid fa-clipboard-list me-1 opacity-75"></i> Đơn hàng
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STAFF')">
                    <a class="nav-link" href="/admin/customer-orders">
                        <i class="fa-solid fa-globe me-1 opacity-75"></i> Đơn Online
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STAFF')">
                    <a class="nav-link" href="/invoices">
                        <i class="fa-solid fa-file-invoice-dollar me-1 opacity-75"></i> Hóa đơn
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STAFF')">
                    <a class="nav-link" href="/payments">
                        <i class="fa-solid fa-credit-card me-1 opacity-75"></i> Thanh toán
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STAFF')">
                    <a class="nav-link" href="/tables">
                        <i class="fa-solid fa-table me-1 opacity-75"></i> Quản lý bàn
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/vouchers">
                        <i class="fa-solid fa-ticket me-1 opacity-75"></i> Voucher
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/bank-settings">
                        <i class="fa-solid fa-building-columns me-1 opacity-75"></i> Ngân hàng
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/contact">
                        <i class="fa-solid fa-address-book me-1 opacity-75"></i> Liên hệ
                    </a>
                </li>
            </ul>

            <!-- User Status + Logout -->
            <ul class="navbar-nav align-items-center" sec:authorize="isAuthenticated()">
                <li class="nav-item me-2">
                    <span class="navbar-text">
                        <span sec:authorize="hasRole('ADMIN')">
                            <i class="fa-solid fa-user-shield"></i> Quản lý
                        </span>
                        <span sec:authorize="hasRole('STAFF')">
                            <i class="fa-solid fa-user-tie"></i> Nhân viên
                        </span>
                        <span sec:authorize="hasRole('CUSTOMER')">
                            <i class="fa-solid fa-mug-hot"></i> Khách hàng
                        </span>
                    </span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm px-3" style="border-radius: 20px;">
                            <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
