<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Thông báo đơn hàng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><div class="mb-4"><h2><i class="fa-solid fa-bell text-warning me-2"></i>Thông báo</h2><p class="text-muted">Cập nhật mới nhất về đơn hàng của bạn.</p></div><div class="list-group shadow-sm"><div th:each="notification : ${notifications}" class="list-group-item list-group-item-action py-3"><div class="d-flex justify-content-between"><strong th:text="${notification.title}">Trạng thái đơn</strong><small class="text-muted" th:text="${#dates.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}">Ngày</small></div><div class="mt-1" th:text="${notification.message}">Nội dung</div><a th:if="${notification.orderId != null}" class="small mt-2 d-inline-block" th:href="@{/my-orders/{id}(id=${notification.orderId})}">Xem đơn hàng</a></div><div th:if="${notifications == null or notifications.isEmpty()}" class="text-center text-muted py-5">Bạn chưa có thông báo nào.</div></div></main></body></html>
