<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý nguyên liệu - Cô Đào Quán POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>
            <i class="fa-solid fa-boxes-stacked text-warning"></i> Quản lý Kho & Nguyên liệu
        </h2>
        <div class="d-flex gap-2">
            <a href="/inventory-transactions" class="btn btn-secondary">
                <i class="fa-solid fa-clock-rotate-left"></i> Lịch sử nhập/xuất kho
            </a>
            <a href="/ingredients/add" class="btn btn-success">
                <i class="fa-solid fa-plus"></i> Nhập nguyên liệu mới
            </a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header text-white d-flex justify-content-between align-items-center">
            <span><i class="fa-solid fa-warehouse"></i> Tồn kho nguyên liệu pha chế</span>
            <span class="badge bg-light text-dark fw-bold" th:text="${ingredients.size()} + ' nguyên liệu'">0 nguyên liệu</span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 70px;">ID</th>
                        <th>Tên nguyên liệu</th>
                        <th>Số lượng tồn kho</th>
                        <th>Đơn vị tính</th>
                        <th>Cảnh báo tồn kho</th>
                        <th class="text-center" style="width: 160px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ingredient : ${ingredients}">
                        <td class="fw-bold" th:text="${ingredient.ingredientId}">1</td>
                        <td class="fw-bold text-dark" th:text="${ingredient.ingredientName}">Sữa tươi</td>
                        <td>
                            <span class="fw-bold fs-6" th:text="${ingredient.quantity}">50</span>
                        </td>
                        <td th:text="${ingredient.unit}">Lít</td>
                        <td>
                            <span class="badge bg-danger" th:if="${ingredient.quantity <= 0}">
                                <i class="fa-solid fa-triangle-exclamation"></i> HẾT HÀNG
                            </span>
                            <span class="badge bg-warning" th:if="${ingredient.quantity > 0 and ingredient.quantity <= 15}">
                                <i class="fa-solid fa-triangle-exclamation"></i> SẮP HẾT KHO
                            </span>
                            <span class="badge bg-success" th:if="${ingredient.quantity > 15}">
                                <i class="fa-solid fa-circle-check"></i> ĐỦ HÀNG
                            </span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{'/ingredients/edit/' + ${ingredient.ingredientId}}" class="btn btn-warning btn-sm" title="Chỉnh sửa">
                                <i class="fa-solid fa-pen"></i> Sửa
                            </a>
                            <a th:href="@{'/ingredients/delete/' + ${ingredient.ingredientId}}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc chắn muốn xóa nguyên liệu này khỏi kho?')" title="Xóa">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
