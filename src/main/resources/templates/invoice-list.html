<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý hóa đơn - Cô Đào Quán POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>
            <i class="fa-solid fa-file-invoice-dollar text-primary"></i> Quản lý Hóa đơn
        </h2>
        <a href="/invoices/add" class="btn btn-success">
            <i class="fa-solid fa-plus"></i> Tạo hóa đơn mới
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header text-white">
            <i class="fa-solid fa-receipt"></i> Danh sách hóa đơn thanh toán
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 70px;">ID</th>
                        <th>Mã đơn hàng</th>
                        <th>Ngày xuất hóa đơn</th>
                        <th>Tổng tiền hóa đơn</th>
                        <th>In phiếu POS 80mm</th>
                        <th class="text-center" style="width: 140px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="i : ${invoices}">
                        <td class="fw-bold" th:text="${i.invoiceId}">1</td>
                        <td>
                            <span class="badge bg-light text-dark fw-bold border" th:text="'Đơn #' + ${i.orders != null ? i.orders.orderId : 'N/A'}">Đơn #1</span>
                        </td>
                        <td th:text="${#dates.format(i.invoiceDate, 'dd/MM/yyyy')}">24/07/2026</td>
                        <td class="fw-bold text-danger" th:text="${i.totalAmount != null ? #numbers.formatDecimal(i.totalAmount, 0, 'COMMA', 0, 'POINT') + ' đ' : '0 đ'}">58,000 đ</td>
                        <td>
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/invoice/{id}(id=${i.invoiceId})}">
                                <i class="fa-solid fa-print"></i> Xem & In Hóa Đơn
                            </a>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/invoices/edit/{id}(id=${i.invoiceId})}" class="btn btn-warning btn-sm" title="Sửa">
                                <i class="fa-solid fa-pen"></i> Sửa
                            </a>
                            <a th:href="@{/invoices/delete/{id}(id=${i.invoiceId})}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa hóa đơn này không?')" title="Xóa">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
