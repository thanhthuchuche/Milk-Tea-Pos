<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý nhân viên - Cô Đào Quán POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>
            <i class="fa-solid fa-user-gear text-primary"></i> Quản lý Tài khoản & Nhân viên
        </h2>
        <a href="/users/add" class="btn btn-success">
            <i class="fa-solid fa-user-plus"></i> Thêm nhân viên mới
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header text-white">
            <i class="fa-solid fa-users-gear"></i> Danh sách nhân viên & phân quyền hệ thống
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 70px;">ID</th>
                        <th>Tên đăng nhập</th>
                        <th>Họ & Tên</th>
                        <th>Điện thoại</th>
                        <th>Email</th>
                        <th>Phân quyền Role</th>
                        <th>Trạng thái</th>
                        <th class="text-center" style="width: 140px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${users}">
                        <td class="fw-bold" th:text="${u.userId}">1</td>
                        <td>
                            <span class="badge bg-light text-dark border fw-bold" th:text="${u.username}">admin</span>
                        </td>
                        <td class="fw-bold text-dark" th:text="${u.fullName}">Quản lý Cô Đào</td>
                        <td th:text="${u.phone}">0912345678</td>
                        <td th:text="${u.email}">admin@codaoquan.com</td>
                        <td>
                            <span class="badge bg-danger" th:if="${u.role != null and u.role.roleName == 'ADMIN'}">
                                <i class="fa-solid fa-user-shield me-1"></i> QUẢN LÝ
                            </span>
                            <span class="badge bg-info" th:if="${u.role != null and u.role.roleName == 'STAFF'}">
                                <i class="fa-solid fa-user-tie me-1"></i> NHÂN VIÊN
                            </span>
                            <span class="badge bg-secondary" th:if="${u.role != null and u.role.roleName == 'CUSTOMER'}">
                                <i class="fa-solid fa-user me-1"></i> KHÁCH HÀNG
                            </span>
                        </td>
                        <td>
                            <span class="badge bg-success" th:if="${u.status == 'ACTIVE'}">HOẠT ĐỘNG</span>
                            <span class="badge bg-danger" th:if="${u.status == 'INACTIVE'}">TẠM KHÓA</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/users/edit/{id}(id=${u.userId})}" class="btn btn-warning btn-sm" title="Sửa">
                                <i class="fa-solid fa-pen"></i> Sửa
                            </a>
                            <a th:href="@{/users/delete/{id}(id=${u.userId})}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa nhân viên này không?')" title="Xóa">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
