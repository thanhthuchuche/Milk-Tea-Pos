<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Món đã lưu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h2><i class="fa-solid fa-heart text-danger me-2"></i>Món đã lưu</h2><p class="text-muted mb-0">Danh sách những món bạn muốn gọi lại nhanh.</p></div>
        <a href="/customer/menu" class="btn btn-primary"><i class="fa-solid fa-mug-hot me-1"></i>Xem thực đơn</a>
    </div>
    <div class="row g-4">
        <div class="col-md-4" th:each="favorite : ${favorites}">
            <div class="card h-100 shadow-sm">
                <img class="card-img-top" style="height:210px;object-fit:cover" th:src="${favorite.product.image != null and #strings.startsWith(favorite.product.image, 'http') ? favorite.product.image : '/images/' + favorite.product.image}" alt="Sản phẩm">
                <div class="card-body d-flex flex-column">
                    <h5 class="fw-bold" th:text="${favorite.product.productName}">Tên món</h5>
                    <p class="text-muted small flex-grow-1" th:text="${favorite.product.description}">Mô tả</p>
                    <div class="d-flex justify-content-between align-items-center mb-3"><strong class="text-danger" th:text="${#numbers.formatDecimal(favorite.product.price, 0, 'COMMA', 0, 'POINT') + ' đ'}">0 đ</strong><a class="small" th:href="@{/customer/product/{id}(id=${favorite.product.productId})}">Chi tiết</a></div>
                    <div class="d-flex gap-2"><a class="btn btn-primary flex-grow-1" th:href="@{/customer-cart/add/{customerId}/{productId}(customerId=${customer.customerId}, productId=${favorite.product.productId})}"><i class="fa-solid fa-cart-plus me-1"></i>Thêm vào giỏ</a><a class="btn btn-outline-danger" th:href="@{/customer/favorite/toggle/{id}(id=${favorite.product.productId}, back='/customer/favorites')}" title="Bỏ lưu"><i class="fa-solid fa-heart-crack"></i></a></div>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${favorites == null or favorites.isEmpty()}" class="text-center py-5 text-muted"><i class="fa-regular fa-heart fa-4x mb-3"></i><h4>Chưa có món nào được lưu</h4><a href="/customer/menu" class="btn btn-primary mt-2">Khám phá thực đơn</a></div>
</main>
</body>
</html>
