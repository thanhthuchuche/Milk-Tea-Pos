<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title th:text="${product.productName}">Chi tiết sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-4">
    <div th:if="${successMessage}" class="alert alert-success"><i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span></div>
    <div th:if="${errorMessage}" class="alert alert-danger"><i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${errorMessage}"></span></div>
    <a href="/customer/menu" class="btn btn-sm btn-outline-secondary mb-3"><i class="fa-solid fa-arrow-left me-1"></i>Quay lại thực đơn</a>
    <div class="row g-4 mb-4">
        <div class="col-md-5"><img class="img-fluid rounded-4 shadow-sm w-100" style="max-height:420px;object-fit:cover" th:src="${product.image != null and #strings.startsWith(product.image, 'http') ? product.image : '/images/' + product.image}" alt="Sản phẩm"></div>
        <div class="col-md-7">
            <div class="d-flex justify-content-between align-items-start"><h1 class="fw-bold" th:text="${product.productName}">Tên sản phẩm</h1><a class="btn btn-outline-danger rounded-circle" th:href="@{/customer/favorite/toggle/{id}(id=${product.productId}, back=${'/customer/product/' + product.productId})}"><i th:class="${favorite ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i></a></div>
            <div class="text-warning mb-3"><i class="fa-solid fa-star"></i> <strong th:text="${#numbers.formatDecimal(averageRating, 1, 1)}">0.0</strong> <span class="text-muted" th:text="${'(' + reviewCount + ' đánh giá)'}">(0 đánh giá)</span></div>
            <p class="text-muted fs-5" th:text="${product.description}">Mô tả sản phẩm</p>
            <div class="fs-3 fw-bold text-danger mb-4" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT') + ' đ'}">0 đ</div>
            <a class="btn btn-primary btn-lg" th:href="@{/customer-cart/add/{customerId}/{productId}(customerId=1, productId=${product.productId})}"><i class="fa-solid fa-cart-plus me-1"></i>Thêm vào giỏ hàng</a>
        </div>
    </div>
    <div class="row g-4">
        <div class="col-lg-7"><div class="card shadow-sm"><div class="card-header"><i class="fa-solid fa-comments me-2"></i>Đánh giá từ khách hàng</div><div class="card-body">
            <div th:each="review : ${reviews}" class="border-bottom py-3"><div class="d-flex justify-content-between"><strong th:text="${review.customer.fullName}">Khách hàng</strong><span class="text-warning" th:text="${'★'.repeat(review.rating)}">★★★★★</span></div><p class="mb-1 mt-2" th:text="${review.comment}">Nhận xét</p><small class="text-muted" th:text="${#dates.format(review.createdAt, 'dd/MM/yyyy HH:mm')}">Ngày</small></div>
            <div th:if="${reviews == null or reviews.isEmpty()}" class="text-muted py-3">Món này chưa có đánh giá.</div>
        </div></div></div>
        <div class="col-lg-5"><div class="card shadow-sm"><div class="card-header"><i class="fa-solid fa-pen me-2"></i>Chia sẻ trải nghiệm</div><div class="card-body">
            <div th:if="${canReview}"><form method="post" th:action="@{/customer/product/{id}/review(id=${product.productId})}"><label class="form-label">Số sao</label><select name="rating" class="form-select mb-3" required><option value="5">★★★★★ - Tuyệt vời</option><option value="4">★★★★ - Rất ngon</option><option value="3">★★★ - Ổn</option><option value="2">★★ - Chưa hợp vị</option><option value="1">★ - Cần cải thiện</option></select><label class="form-label">Bình luận</label><textarea name="comment" class="form-control mb-3" rows="4" required th:text="${ownReview != null ? ownReview.comment : ''}" placeholder="Món hôm nay thế nào?"></textarea><button class="btn btn-primary w-100"><i class="fa-solid fa-paper-plane me-1"></i>Lưu đánh giá</button></form></div>
            <div th:unless="${canReview}" class="text-muted">Bạn có thể đánh giá sau khi mua và hoàn tất món này.</div>
        </div></div></div>
    </div>
</main>
</body>
</html>
