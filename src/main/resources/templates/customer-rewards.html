<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Đổi điểm nhận quà</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container py-4"><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><div class="d-flex justify-content-between align-items-center mb-4"><div><h2><i class="fa-solid fa-gift text-warning me-2"></i>Đổi điểm lấy quà</h2><p class="text-muted mb-0">Dùng điểm thành viên để nhận voucher ưu đãi.</p></div><span class="badge bg-warning text-dark fs-6"><i class="fa-solid fa-star me-1"></i><span th:text="${customer.point != null ? customer.point : 0}">0</span> điểm</span></div><div class="row g-4"><div class="col-md-4" th:each="reward : ${rewards}"><div class="card h-100 shadow-sm border-warning"><div class="card-body"><span class="badge bg-danger mb-2" th:text="${'-' + reward.discountPercent + '%'}">-10%</span><h5 class="fw-bold" th:text="${reward.voucherCode}">VOUCHER</h5><p class="text-muted" th:text="${reward.rewardDescription != null ? reward.rewardDescription : 'Voucher ưu đãi cho thành viên.'}">Mô tả</p><div class="d-flex justify-content-between align-items-center"><strong class="text-warning"><i class="fa-solid fa-star"></i> <span th:text="${reward.requiredPoints}">50</span> điểm</strong><a class="btn btn-primary btn-sm" th:href="@{/customer/rewards/redeem/{id}(id=${reward.voucherId})}">Đổi ngay</a></div></div></div></div></div><div class="card shadow-sm mt-5"><div class="card-header"><i class="fa-solid fa-ticket me-2"></i>Voucher đã đổi</div><div class="card-body"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Mã</th><th>Ưu đãi</th><th>Ngày đổi</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="owned : ${ownedVouchers}"><td class="fw-bold text-primary" th:text="${owned.voucher.voucherCode}">CODE</td><td th:text="${'-' + owned.voucher.discountPercent + '%'}">-10%</td><td th:text="${#dates.format(owned.redeemedAt, 'dd/MM/yyyy HH:mm')}">Ngày</td><td><span class="badge bg-success" th:text="${owned.status}">AVAILABLE</span></td></tr><tr th:if="${ownedVouchers == null or ownedVouchers.isEmpty()}"><td colspan="4" class="text-center text-muted py-3">Bạn chưa đổi voucher nào.</td></tr></tbody></table></div></div></div></main></body></html>
